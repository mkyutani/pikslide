name: issue

# A pull request says which issue it closes (Closes #N, Fixes #N or
# Resolves #N, as GitHub reads them), so that every change reaches main
# for an issue: main's ruleset requires this check (CONTRIBUTING.md).
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions: {}

jobs:
  closes-issue:
    runs-on: ubuntu-latest
    steps:
      - name: The description closes an issue
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: |
          if printf '%s\n' "$BODY" | grep -Eiq '(^|[^[:alnum:]])(close[sd]?|fix(e[sd])?|resolve[sd]?):? +#[0-9]+'; then
            exit 0
          fi
          echo "::error::Say in the description which issue this pull request closes: Closes #N"
          exit 1
