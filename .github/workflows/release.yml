name: release

# On a v* tag: test, build, publish to TestPyPI, then to PyPI, with
# Trusted Publishing (OIDC; no API token is stored), and make the GitHub
# release. Each index needs a publisher registered for this repository,
# this workflow file (release.yml), and the environment named below.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"
      - name: Check the tag matches the version in pyproject.toml
        run: test "v$(uv version --short)" = "$GITHUB_REF_NAME"
      - name: Install rsvg-convert, for the SVG image tests
        run: sudo apt-get update && sudo apt-get install -y librsvg2-bin
      - run: uv run --locked pytest
      - run: uv build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  testpypi:
    needs: build
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      # No checkout here, so no uv.lock to key a cache on.
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: false
      - run: uv publish --publish-url https://test.pypi.org/legacy/
      - name: Smoke-test the TestPyPI release from a clean environment
        run: |
          uv venv "$RUNNER_TEMP/smoke"
          # The new release can take a moment to show up in the index.
          for i in 1 2 3 4 5 6; do
            uv pip install --python "$RUNNER_TEMP/smoke" --no-cache \
              --index-url https://test.pypi.org/simple/ --extra-index-url https://pypi.org/simple/ \
              --index-strategy unsafe-best-match "pikslide==${GITHUB_REF_NAME#v}" && break
            sleep 20
          done
          pikslide="$RUNNER_TEMP/smoke/bin/pikslide"
          "$pikslide" --version
          "$pikslide" --help llm > /dev/null
          printf 'box "Source"\narrow\nbox "Deck"\n' > smoke.pik
          "$pikslide" smoke.pik smoke.pptx
          test -s smoke.pptx

  pypi:
    needs: testpypi
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: false
      - run: uv publish

  # The GitHub release, with the files published: its notes are the
  # version bump's commit message (scripts/release_notes.py), then the
  # changes since the last release, as GitHub links them.
  github-release:
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # All of history, for the tag's commit message.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Create the release, with the notes and the files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/release_notes.py "$GITHUB_REF_NAME" > "$RUNNER_TEMP/notes.md"
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --title "$GITHUB_REF_NAME" \
            --notes-file "$RUNNER_TEMP/notes.md" --generate-notes
