[project]
name = "pikslide"
version = "0.1.0"
description = "A text language for drawing diagrams as native, editable PowerPoint objects"
readme = "README.md"
license = "0BSD"
license-files = ["LICENSE"]
authors = [
    { name = "Miki Yutani", email = "mkyutani@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "pillow>=12.3.0",
    "python-pptx>=1.0.2",
]

[project.scripts]
pikslide = "pikslide:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
